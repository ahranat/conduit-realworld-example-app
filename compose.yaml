services:
  database:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: practice-password
      POSTGRES_DB: conduit
    volumes:
      - database-data:/var/lib/postgresql/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://backend:3001
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DEV_DB_HOSTNAME: database
      DEV_DB_USERNAME: conduit
      DEV_DB_PASSWORD: practice-password
      DEV_DB_NAME: conduit
      DEV_DB_DIALECT: postgres
      JWT_KEY: practice-jwt-secret
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["test"]
    environment:
      BE_BASE_URL: http://backend:3001
      FE_BASE_URL: http://frontend:3000
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

volumes:
  database-data:
    external: true
    name: conduit-db-data